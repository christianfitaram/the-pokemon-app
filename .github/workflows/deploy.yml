name: 🚀 Deploy to GCP VM

on:
  push:
    branches:
      - main  # Change if your default branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.GCP_VM_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VM via PM2
      run: |
        ssh ${{ secrets.GCP_VM_USERNAME }}@${{ secrets.GCP_VM_HOST }} << 'EOF'
        # Load NVM and use the correct Node version
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        
        # Use the full path to PM2
        PM2_PATH="$HOME/.nvm/versions/node/v22.18.0/bin/pm2"
        
        cd ${{ secrets.GCP_VM_PATH }}
        git pull origin main
        npm install
        npm run build
        $PM2_PATH restart the-pokemon-app
        EOF
      
